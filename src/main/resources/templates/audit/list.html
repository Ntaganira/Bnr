<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <title>
        Audit Logs
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

    <div th:replace="fragments/navbar :: navbar">
    </div>

    <div class="container-fluid">

        <div class="row">

            <div class="col-md-2 p-0">

                <div th:replace="fragments/sidebar :: sidebar">
                </div>

            </div>

            <div class="col-md-10 p-4">

                <div class="d-flex
                        justify-content-between
                        align-items-center
                        mb-4">

                    <div>

                        <h3 class="fw-bold mb-1">

                            Audit Logs

                        </h3>

                        <small class="text-muted">

                            Workflow and compliance activity tracking

                        </small>

                    </div>

                </div>

                <div class="card card-custom shadow-sm">

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead class="table-light">

                                    <tr>

                                        <th>
                                            Timestamp
                                        </th>

                                        <th>
                                            Actor
                                        </th>

                                        <th>
                                            Action
                                        </th>

                                        <th>
                                            Previous State
                                        </th>

                                        <th>
                                            New State
                                        </th>

                                    </tr>

                                </thead>

                                <tbody>

                                    <tr th:if="${auditLogs.content.isEmpty()}">

                                        <td colspan="5" class="text-center text-muted py-5">

                                            No audit logs available.

                                        </td>

                                    </tr>

                                    <tr th:each="log : ${auditLogs.content}">

                                        <td th:text="${log.timestamp}">
                                        </td>

                                        <td>

                                            <div class="d-flex
                                                align-items-center
                                                gap-2">

                                                <i class="bi bi-person-circle">
                                                </i>

                                                <span th:text="${log.actor}">
                                                </span>

                                            </div>

                                        </td>

                                        <td>

                                            <span class="badge bg-dark" th:text="${log.action}">
                                            </span>

                                        </td>

                                        <td th:text="${log.previousState}">
                                        </td>

                                        <td th:text="${log.newState}">
                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                        <div class="d-flex
                                justify-content-between
                                align-items-center
                                mt-4">

                            <small class="text-muted">

                                Page

                                <span th:text="${auditLogs.number + 1}">
                                </span>

                                of

                                <span th:text="${auditLogs.totalPages}">
                                </span>

                            </small>

                            <div class="d-flex gap-2">

                                <a class="btn btn-outline-secondary btn-sm" th:if="${auditLogs.hasPrevious()}" th:href="@{/audit-logs(
                                    page=${auditLogs.number - 1},
                                    size=${auditLogs.size})}">

                                    Previous

                                </a>

                                <a class="btn btn-outline-secondary btn-sm" th:if="${auditLogs.hasNext()}" th:href="@{/audit-logs(
                                    page=${auditLogs.number + 1},
                                    size=${auditLogs.size})}">

                                    Next

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div th:replace="fragments/footer :: footer">
    </div>

</body>

</html>
