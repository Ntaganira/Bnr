<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        New Application
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body class="bg-light">
    
<div th:replace="~{fragments/navbar :: navbar}">
</div>

    <div class="container-fluid">

        <div class="row">

            <div class="col-md-2 p-0">

                <div th:replace="fragments/sidebar :: sidebar">
                </div>

            </div>

            <div class="col-md-10 p-4">

                <div class="card card-custom shadow-sm">

                    <div class="card-body p-5">

                        <h3 class="fw-bold mb-4">

                            New License Application

                        </h3>

                        <form th:action="@{/applications}" th:object="${request}" method="post">

                            <!-- INSTITUTION -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Institution Name

                                </label>

                                <input type="text" th:field="*{institutionName}" class="form-control">

                            </div>

                            <!-- TYPE -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Institution Type

                                </label>

                                <select th:field="*{institutionType}" class="form-select">

                                    <option value="">
                                        Select Type
                                    </option>

                                    <option value="COMMERCIAL_BANK">
                                        Commercial Bank
                                    </option>

                                    <option value="MICROFINANCE">
                                        Microfinance
                                    </option>

                                    <option value="INSURANCE">
                                        Insurance
                                    </option>

                                </select>

                            </div>

                            <!-- REGISTRATION -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Registration Number

                                </label>

                                <input type="text" th:field="*{registrationNumber}" class="form-control">

                            </div>

                            <!-- DESCRIPTION -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">

                                    Business Description

                                </label>

                                <textarea th:field="*{businessDescription}" rows="5" class="form-control">
                            </textarea>

                            </div>

                            <div class="d-flex justify-content-end">

                                <button type="submit" class="btn btn-primary-custom px-4">

                                    Create Application

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
