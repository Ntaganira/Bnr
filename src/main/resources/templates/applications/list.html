<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        Applications
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">

        <div class="row">

            <div class="col-md-2 p-0">

                <div th:replace="~{fragments/sidebar :: sidebar}">
                </div>

            </div>

            <div class="col-md-10 p-4">

                <div class="d-flex justify-content-between
                        align-items-center mb-4">

                    <h3 class="fw-bold">

                        Applications

                    </h3>

                </div>

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead class="table-light">

                                    <tr>

                                        <th>
                                            Application No
                                        </th>

                                        <th>
                                            Institution
                                        </th>

                                        <th>
                                            Status
                                        </th>

                                        <th>
                                            Applicant
                                        </th>

                                        <th>
                                            Submitted At
                                        </th>

                                        <th class="text-end">
                                            Actions
                                        </th>

                                    </tr>

                                </thead>

                                <tbody>

                                    <tr th:if="${applications.content.isEmpty()}">

                                        <td colspan="6" class="text-center text-muted py-5">

                                            No applications found.

                                        </td>

                                    </tr>

                                    <tr th:each="app : ${applications.content}">

                                        <td th:text="${app.applicationNumber}">
                                        </td>

                                        <td th:text="${app.institutionName}">
                                        </td>

                                        <td>

                                            <span class="badge" th:classappend="
                                                ${app.status == 'APPROVED'} ? ' bg-success' :
                                                (${app.status == 'REJECTED'} ? ' bg-danger' :
                                                (${app.status == 'UNDER_REVIEW'} ? ' bg-warning text-dark' :
                                                (${app.status == 'SUBMITTED'} ? ' bg-primary' :
                                                ' bg-secondary')))" th:text="${app.status}">
                                            </span>

                                        </td>

                                        <td th:text="${app.applicantEmail}">
                                        </td>

                                        <td>

                                            <span th:text="${app.submittedAt}">
                                            </span>

                                        </td>

                                        <td class="text-end">

                                            <a href="#" class="btn btn-sm btn-dark">

                                                View

                                            </a>

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                        <div class="d-flex justify-content-between
                                align-items-center mt-4">

                            <small class="text-muted">

                                Page

                                <span th:text="${applications.number + 1}">
                                </span>

                                of

                                <span th:text="${applications.totalPages}">
                                </span>

                            </small>

                            <div class="d-flex gap-2">

                                <a class="btn btn-outline-secondary btn-sm" th:if="${applications.hasPrevious()}"
                                    th:href="@{/applications(
                                    page=${applications.number - 1},
                                    size=${applications.size})}">

                                    Previous

                                </a>

                                <a class="btn btn-outline-secondary btn-sm" th:if="${applications.hasNext()}" th:href="@{/applications(
                                    page=${applications.number + 1},
                                    size=${applications.size})}">

                                    Next

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div th:replace="~{fragments/footer :: footer}">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
