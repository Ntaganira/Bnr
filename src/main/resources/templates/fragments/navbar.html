<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
      th:href="@{/css/app.css}">
</head>
<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom shadow-sm">

        <div class="container-fluid px-4">

            <a class="navbar-brand fw-bold" th:href="@{/dashboard}">

                Bank Licensing Portal

            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon">
                </span>

            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">

                        <a class="nav-link" th:href="@{/dashboard}">

                            Dashboard

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link" th:href="@{/applications}">

                            Applications

                        </a>

                    </li>

                </ul>

                <div class="d-flex align-items-center gap-3">

                    <span class="text-light small">

                        Signed in as

                        <strong th:text="${#authentication != null ? #authentication.name : 'Guest'}"></strong>

                    </span>

                    <form th:action="@{/logout}" method="post" class="m-0">

                        <button type="submit" class="btn btn-outline-light btn-sm">

                            Logout

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </nav>

</body>

</html>
