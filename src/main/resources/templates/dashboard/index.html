<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        Dashboard
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">

        <div class="row">

            <div class="col-md-2 p-0">

                <div th:replace="~{fragments/sidebar :: sidebar}">
                </div>

            </div>

            <div class="col-md-10 p-4">

                <h2 class="mb-4">
                    Dashboard
                </h2>

                <div class="row g-4">

                    <div class="col-md-3">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Total Applications
                                </h6>

                                <h2 class="fw-bold">
                                    12
                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Under Review
                                </h6>

                                <h2 class="fw-bold text-warning">
                                    4
                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Approved
                                </h6>

                                <h2 class="fw-bold text-success">
                                    6
                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Rejected
                                </h6>

                                <h2 class="fw-bold text-danger">
                                    2
                                </h2>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
