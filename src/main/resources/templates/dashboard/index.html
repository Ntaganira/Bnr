<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <title>
        Dashboard
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="bg-light">

    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid">

        <div class="row">

            <div class="col-md-2 p-0">

                <div th:replace="fragments/sidebar :: sidebar"></div>

            </div>

            <div class="col-md-10 p-4">

                <h2 class="mb-4">
                    Dashboard
                </h2>

                <div class="row g-4">

                    <div class="col-md-3">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Total Applications
                                </h6>

                                <h2 class="fw-bold" th:text="${stats.totalApplications}">
                                </h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Under Review
                                </h6>

                                <h2 class="fw-bold text-warning" th:text="${stats.underReviewApplications}">
                                </h2>

                            </div>

                        </div>

                    </div>
                    <div class="col-lg-6">

                        <div class="card card-custom shadow-sm">

                            <div class="card-body p-4">

                                <div class="d-flex
                            justify-content-between
                            align-items-center
                            mb-4">

                                    <div>

                                        <h5 class="fw-bold mb-1">

                                            Application Status Distribution

                                        </h5>

                                        <small class="text-muted">

                                            Workflow overview across all applications

                                        </small>

                                    </div>

                                </div>

                                <div style="height: 350px;">

                                    <canvas id="statusChart">
                                    </canvas>

                                </div>

                            </div>

                        </div>

                    </div>
                    <div class="col-md-3">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Approved
                                </h6>

                                <h2 class="fw-bold text-success" th:text="${stats.approvedApplications}">
                                </h2>

                            </div>

                        </div>

                    </div>
                    <div class="col-md-3"></div>

                    <div class="col-md-3">

                        <div class="card shadow-sm border-0">

                            <div class="card-body">

                                <h6 class="text-muted">
                                    Rejected
                                </h6>

                                <h2 class="fw-bold text-danger" th:text="${stats.rejectedApplications}">
                                </h2>

                            </div>

                        </div>

                    </div>

                </div>
            </div>

        </div>

    </div>

    <div th:replace="fragments/footer :: footer"></div>

</body>

<script src="https://cdn.jsdelivr.net/npm/chart.js">
</script>
<script th:inline="javascript">

    const submitted =
    /*[[${stats.submittedApplications}]]*/ 0;

    const underReview =
        /*[[${ stats.underReviewApplications }]]*/ 0;

    const approved =
       /* [[${ stats.approvedApplications }]]*/ 0;

    const rejected =
       /* [[${ stats.rejectedApplications }]]*/ 0;

    const ctx =
        document.getElementById(
            'statusChart'
        );

    new Chart(ctx, {

        type: 'doughnut',

        data: {

            labels: [

                'Submitted',
                'Under Review',
                'Approved',
                'Rejected'

            ],

            datasets: [{

                data: [

                    submitted,
                    underReview,
                    approved,
                    rejected

                ],

                backgroundColor: [

                    '#8B4513',
                    '#D4A017',
                    '#198754',
                    '#DC3545'

                ],

                borderWidth: 1

            }]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            plugins: {

                legend: {

                    position: 'bottom'

                }

            }

        }

    });

</script>

</html>
